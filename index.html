<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>Artist Portfolio</title>
    <meta
      name="description"
      content="Minimal contemporary fine art portfolio with a single scrolling gallery experience."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Fixed navigation that remains unobtrusive while scrolling -->
    <header class="site-header" id="top">
      <nav class="site-nav" aria-label="Primary">
        <a class="brand" href="#top">reus.eart</a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <span class="sr-only">Toggle navigation</span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="#gallery">Gallery</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Minimal hero introduction -->
      <section class="hero" aria-labelledby="artist-name">
        <div class="hero-inner">
          <h1 id="artist-name">reus.eart</h1>
          <p>
            Recreating my favourite places in Zurich, through my favourite pieces of art.
          </p>
          <nav class="hero-links" aria-label="Quick links">
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>
      </section>

      <!-- Vertical, full-width gallery flow -->
      <section class="gallery" id="gallery" aria-label="Artwork gallery">
        <article class="artwork reveal">
          <figure>
            <img
              src="images/unterer-letten.jpg"
              alt="Mäda Unterach Fir Forest"
              class="artwork-image"
              loading="lazy"
              width="3800"
              height="3275"
            />
            <figcaption>
              <h2>Mäda Unterach Fir Forest</h2>
              <p class="meta">Collage · 2024 · 50 × 70 cm</p>
              <p>
                This collage reimagines Zurich's Unterer Letten using fragments of paintings by Gustav Klimt. 
                His signature gilded patterns, rich textures, and ornamental motifs are woven into a familiar 
                riverside landscape, where a radiant golden sun and vibrant pink sky transform the everyday 
                into an emotional imprint. Blending Klimt's symbolic visual language with a contemporary setting, 
                the work invites viewers to see Unterer Letten as a dreamlike 
                landscape where memory, beauty, and imagination converge across time.
              </p>
            </figcaption>
          </figure>
        </article>

        <article class="artwork reveal">
          <figure>
            <img
              src="images/nordbrucke.jpg"
              alt="Nordbrüggli artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="2800"
            />
            <figcaption>
              <h2>Nordbrüggli</h2>
              <p class="meta">Collage · 2025 · 60 × 50 cm</p>
              <p>
                The familiar corner of Wipkingen dissolves into a kaleidoscope of faces and fleeting encounters,
                each fragment contributing to the rhythm of a place shaping conversations, chances, and community.
                Bringing together the worlds of Renoir, Van Gogh, Hopper, Gauguin, Bacon, Degas, Manet, Kahlo, Klimt, 
                and many others, the collage dissolves the boundaries between artistic traditions. 
                Their figures step beyond the confines of their original canvases, leave behind the solitude of the museum and
                gather beneath the awnings of Nordbrücke, as though reunited over coffee and wine. 
               
              </p>
            </figcaption>
          </figure>
        </article>

        <article class="artwork reveal">
          <figure>
            <img
              src="images/dorme.jpg"
              alt="Dorme artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="2800"
            />
            <figcaption>
              <h2>Dorme</h2>
              <p class="meta">Collage · 2025 · 20 × 30 cm</p>
              <p>
                The blues of Van Gogh's skies envelop the sleeping figure, transforming an ordinary bed into a landscape 
                of comfort and calm. Constructed from countless painted fragments, the work celebrates the beauty of 
                texture and form. Interlocking shapes echo the crumpled geometry of fabric, dissolving the boundary between 
                abstraction and intimacy. Wrapped in warmth and stillness, the figure becomes almost inseparable from the 
                surrounding quilt, as though absorbed into a dream. Here, home is not simply a place, but a feeling of 
                shelter, softness, and peace.
              </p>
            </figcaption>
          </figure>
        </article>
                <article class="artwork reveal">
          <figure>
            <img
              src="images/viadukt.jpg"
              alt="Viadotto artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="3000"
            />
            <figcaption>
              <h2>Viadotto</h2>
              <p class="meta">Collage · 2026 · 70 × 50 cm</p>
              <p>
                A view of the Viadukt where line and color seem to seal off every path of escape. 
                A solitary figure meets the viewer with quiet despair and resignation. 
                Though no crowd is present, the scene feels densely inhabited, charged with the pressure 
                and weight of the city.
              </p>
            </figcaption>
          </figure>
        </article>

        <article class="artwork reveal">
          <figure>
            <img
              src="images/dipinge.jpg"
              alt="Dipinge artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="3000"
            />
            <figcaption>
              <h2>Dipinge</h2>
              <p class="meta">Collage · 2024 · 20 × 15 cm</p>
              <p>
                A three-part collage capturing the intimate act of artistic creation. Pablo Picasso, Samuel Buri,
                and Martin Peter Fluck converge in a layered interior where concentration, memory, and invention
                meet. Brushes, bottles, and paper crowd the foreground, while the window opens onto a radiant
                landscape, turning the studio into a suspended space between observation and imagination.
              </p>
            </figcaption>
          </figure>
        </article>      </section>
    </main>

    <!-- Simple contact footer -->
    <footer class="site-footer" id="contact">
      <p>Francesco Varoli</p>
      <p><a href="mailto:francesco.varoli95@gmail.com">francesco.varoli95@gmail.com</a></p>
      <p>
        <a href="https://instagram.com/reus.eart" target="_blank" rel="noopener noreferrer">
          Instagram/reus.eart <span class="sr-only">(opens in new tab)</span>
        </a>
      </p>
      <p>© <span id="year"></span> reus.eart - All rights reserved.</p>
    </footer>
  </body>
</html>
