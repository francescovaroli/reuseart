<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=5.0"
    />
    <title>reus.eart collages</title>
    <meta
      name="description"
      content="Artist portfolio. Collages from Zurich."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=EB+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Fixed navigation that remains unobtrusive while scrolling -->
    <header class="site-header" id="top">
      <nav class="site-nav" aria-label="Primary">
        <a class="brand" href="#top">reus.eart</a>
        <button
          class="menu-toggle"
          type="button"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <span class="sr-only">Toggle navigation</span>
          <span></span>
          <span></span>
        </button>
        <ul class="nav-links" id="nav-links">
          <li><a href="#gallery">Gallery</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Minimal hero introduction -->
      <section class="hero" aria-labelledby="artist-name">
        <div class="hero-inner">
          <h1 id="artist-name">reus.eart</h1>
          <p>
            Recreating my favourite places in Zurich, through my favourite pieces of art.
          </p>
          <nav class="hero-links" aria-label="Quick links">
            <a href="#gallery">Gallery</a>
            <a href="#contact">Contact</a>
          </nav>
        </div>
      </section>

      <!-- Vertical, full-width gallery flow -->
      <section class="gallery" id="gallery" aria-label="Artwork gallery">
        <article class="artwork reveal">
          <figure>
            <img
              src="images/unterer-letten.jpg"
              alt="Mäda Unterach Fir Forest"
              class="artwork-image"
              loading="lazy"
              width="3800"
              height="3275"
            />
            <figcaption>
              <h2>Mäda Unterach Fir Forest</h2>
              <p class="meta">Collage · 2024 · 50 × 70 cm</p>
              <p>
                A late swim in the Limmat, when few people are still around, and the colors of the sunset fill the sky. 
                This is how summer feels to me, the dreamlike evenings that should never end.
                It's this emotion that I tried to capture using an old beautiful calendar of Klimt's masterpieces.
                After months of cutting, gluing, and rearranging, the Fir Forest had turned into a river while Mäda Primavesi's dress 
                into white clouds. At last, Unterer Letten emerged.
              </p>
            </figcaption>
          </figure>
        </article>

        <article class="artwork reveal">
          <figure>
            <img
              src="images/nordbrucke.jpg"
              alt="Nordbrüggli artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="2800"
            />
            <figcaption>
              <h2>Nordbrüggli</h2>
              <p class="meta">Collage · 2025 · 60 × 50 cm</p>
              <p>
                Sitting on the colorful chairs of Nordbrücke with a glass of wine and Wipkingen passing by.
                Everyone should get to experience the life, community, chaos and joy of this place.
                Leaving behind the solitude of the museum, the figures painted by Renoir, Van Gogh and many others, 
                headed for a coffee and chat in our neighbourhood. 
                Should we meet at Nordbrücke?             
              </p>
            </figcaption>
          </figure>
        </article>

        <article class="artwork reveal">
          <figure>
            <img
              src="images/dorme.jpg"
              alt="Dorme artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="2800"
            />
            <figcaption>
              <h2>Dorme</h2>
              <p class="meta">Collage · 2025 · 20 × 30 cm</p>
              <p>
                She is having a sleep in Van Gogh's blue skies, and it doesn't look like she's getting up anytime soon.
                A rainy Sunday lost in this fluffy quilt is what I would call a good Winter day.
              </p>
            </figcaption>
          </figure>
        </article>
                <article class="artwork reveal">
          <figure>
            <img
              src="images/viadukt.jpg"
              alt="Viadotto artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="3000"
            />
            <figcaption>
              <h2>Viadotto</h2>
              <p class="meta">Collage · 2026 · 70 × 50 cm</p>
              <p>
                This old man is feeling the pressure of the whole city on his shoulders. None is around and yet everything is 
                so crowded. Luckily he found this little corner, where an unexpected kiosk gives shelter to the wandering outcasts.
              </p>
            </figcaption>
          </figure>
        </article>

        <article class="artwork reveal">
          <figure>
            <img
              src="images/dipinge.jpg"
              alt="Dipinge artwork"
              class="artwork-image"
              loading="lazy"
              width="3600"
              height="3000"
            />
            <figcaption>
              <h2>Dipinge</h2>
              <p class="meta">Collage · 2024 · 20 × 15 cm</p>
              <p>
                Is there a place between observation and creation? Pablo Picasso, Samuel Buri,
                and Martin Peter Fluck join forces in this three-pieces collage depicting a simple answer to 
                this impossible question.
              </p>
            </figcaption>
          </figure>
        </article>      </section>
    </main>

    <!-- Simple contact footer -->
    <footer class="site-footer" id="contact">
      <p>Francesco Varoli</p>
      <p><a href="mailto:francesco.varoli95@gmail.com">francesco.varoli95@gmail.com</a></p>
      <p>
        <a href="https://instagram.com/reus.eart" target="_blank" rel="noopener noreferrer">
          Instagram/reus.eart <span class="sr-only">(opens in new tab)</span>
        </a>
      </p>
      <p>© <span id="year"></span> reus.eart - All rights reserved.</p>
    </footer>
  </body>
</html>
